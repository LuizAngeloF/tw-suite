const WORLD_RE = /^[a-z]{2,3}(s|p|c)?\d{1,4}$/i;
const isWorld = (s) => WORLD_RE.test(String(s || '').trim());

function parseAccounts(text, defaultWorld) {
  const seen = new Set();
  let passwords = 0;
  const rows = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((line) => {
    let world = '';
    let nick = '';
    const parts = line.split('|').map((s) => s.trim());
    if (parts.length === 1) {
      const c = line.indexOf(':');
      if (c > 0 && isWorld(line.slice(0, c))) {
        world = line.slice(0, c);
        nick = line.slice(c + 1).trim();
      } else {
        nick = line;
        world = defaultWorld;
      }
    } else if (parts.length === 2) {
      if (isWorld(parts[1])) { nick = parts[0]; world = parts[1]; }
      else if (isWorld(parts[0])) { world = parts[0]; nick = parts[1]; }
      else { nick = parts[0]; world = defaultWorld; passwords++; }
    } else {
      nick = parts[0];
      const last = parts[parts.length - 1];
      world = isWorld(last) ? last : defaultWorld;
      passwords++;
    }
    const row = { raw: line, world: String(world || '').toLowerCase(), nick };
    if (!row.nick) row.error = 'nick vazio';
    else if (!isWorld(row.world)) row.error = 'mundo não identificado';
    else {
      const key = accountKey(row.world, row.nick);
      if (seen.has(key)) row.error = 'repetida na lista';
      else if (state.profiles[key]) row.exists = true;
      seen.add(key);
    }
    return row;
  });
  return { rows, passwords };
}

function openBulk() {
  const b = {
    step: 1,
    text: '',
    world: (state.selected && splitKey(state.selected).world) || 'br144',
    plan: Object.fromEntries(PLAN_MODULES.map((id) => [id, 'off'])),
    base: null,
    test: true,
  };

  const validRows = () => parseAccounts(b.text, b.world).rows.filter((r) => !r.error && !r.exists);

  function stepper() {
    return `
      <div class="stepper">
        <span class="step ${b.step === 1 ? 'cur' : 'done'}"><i>${b.step === 1 ? '1' : icon('check', 'sm')}</i>Colar contas</span>
        <span class="step-line ${b.step === 2 ? 'done' : ''}"></span>
        <span class="step ${b.step === 2 ? 'cur' : ''}"><i>2</i>Configurar scripts</span>
      </div>`;
  }

  function parseHTML() {
    const { rows, passwords } = parseAccounts(b.text, b.world);
    if (!rows.length) return '';
    const warn = passwords ? `<div class="callout warn" style="margin:14px 0 0">${icon('key')}<div><b>Senhas detectadas e descartadas.</b> O TW Suite roda no seu navegador, já logado — ele nunca precisa nem guarda a sua senha.</div></div>` : '';
    return `${warn}<div class="parse">${rows.map((r) => `
      <div class="parse-row ${r.error ? 'bad' : ''}">
        <span class="w">${esc(r.world || '???')}</span>
        <span>${esc(r.nick || r.raw)}</span>
        ${r.error ? `<span class="tag tag-off">${esc(r.error)}</span>` : r.exists ? '<span class="tag tag-off">já existe</span>' : '<span class="tag tag-live">nova</span>'}
      </div>`).join('')}</div>`;
  }

  function planHTML() {
    return PLAN_MODULES.map((id) => {
      const m = MOD[id];
      const v = b.plan[id];
      const label = v === 'off' ? 'Desligado' : v === 'model' ? 'Do modelo' : (m.presets.find((p) => p.id === v) || {}).label;
      return `
        <div class="plan-card ${v !== 'off' ? 'on' : ''}">
          <div class="plan-card-top"><span class="tile-icon">${icon(m.icon, 'sm')}</span><div><b>${esc(m.name)}</b><span>${esc(m.screen)}</span></div></div>
          <button class="picker" data-plan="${id}" type="button"><span class="pk-v"><b>${esc(label)}</b></span>${icon('chev', 'sm')}</button>
        </div>`;
    }).join('');
  }

  function summary() {
    const n = validRows().length;
    const s = PLAN_MODULES.filter((id) => b.plan[id] !== 'off').length;
    return `${icon('check', 'sm')}<span><b>${n}</b> conta${n === 1 ? '' : 's'} com <b>${s}</b> script${s === 1 ? '' : 's'}</span>`;
  }

  function render() {
    const baseModel = b.base ? allModels().find((x) => x.id === b.base) : null;
    const body = b.step === 1 ? `
      <div class="callout">${icon('spark')}<div><b>Adição inteligente.</b> Uma conta por linha: <code>nick|mundo</code>, <code>mundo:nick</code> ou só o <code>nick</code> (usa o mundo padrão).</div></div>
      <div class="row2" style="grid-template-columns: 1fr 160px; align-items:end">
        <label><span class="field-label">Contas</span></label>
        <label><span class="field-label">Mundo padrão</span></label>
      </div>
      <div class="row2" style="grid-template-columns: 1fr 160px; align-items:start">
        <textarea class="field" id="b-text" rows="6" placeholder="Agostinho|br144&#10;br144:Carrara&#10;OutroNick" spellcheck="false">${esc(b.text)}</textarea>
        <input class="field mono" id="b-world" value="${esc(b.world)}" autocomplete="off" spellcheck="false">
      </div>
      <div id="b-parse">${parseHTML()}</div>` : `
      <div class="callout">${icon('bolt')}<div><b>Automatize suas contas.</b> O que escolher aqui vale para todas as contas novas da lista.</div></div>
      <div style="display:flex; gap:12px; align-items:end; flex-wrap:wrap; margin-bottom:16px">
        <div style="flex:1; min-width:220px">
          <span class="field-label">Partir de um modelo</span>
          <button class="picker" id="b-base" type="button"><span class="pk-v"><b>${esc(baseModel ? baseModel.name : 'Nenhum')}</b><span>${esc(baseModel ? baseModel.desc : 'Escolha módulo por módulo abaixo')}</span></span>${icon('chev', 'sm')}</button>
        </div>
        <div class="fine fine-row" style="height:52px; padding:0 14px; border:1px solid var(--line-2); border-radius:10px; gap:14px">
          <span>Modo teste</span>
          <button class="lever sm" role="switch" aria-checked="${b.test}" id="b-test" aria-label="Modo teste"></button>
        </div>
      </div>
      <div class="plan">${planHTML()}</div>`;

    modal.querySelector('.modal-body').innerHTML = body;
    modal.querySelector('#b-stepper').innerHTML = stepper();
    modal.querySelector('#b-summary').innerHTML = summary();
    modal.querySelector('#b-back').hidden = b.step === 1;
    const next = modal.querySelector('#b-next');
    next.innerHTML = b.step === 1 ? `Continuar${icon('chev', 'sm')}` : `${icon('plus', 'sm')}Adicionar (${validRows().length})`;
    next.querySelector('.ico').style.transform = b.step === 1 ? 'rotate(-90deg)' : '';

    if (b.step === 1) {
      const ta = modal.querySelector('#b-text');
      ta.addEventListener('input', () => {
        b.text = ta.value;
        modal.querySelector('#b-parse').innerHTML = parseHTML();
        modal.querySelector('#b-summary').innerHTML = summary();
      });
      modal.querySelector('#b-world').addEventListener('input', (e) => {
        b.world = e.target.value.trim().toLowerCase();
        modal.querySelector('#b-parse').innerHTML = parseHTML();
        modal.querySelector('#b-summary').innerHTML = summary();
      });
    } else {
      modal.querySelector('#b-test').addEventListener('click', (e) => {
        b.test = !b.test;
        e.currentTarget.setAttribute('aria-checked', String(b.test));
      });
      modal.querySelector('#b-base').addEventListener('click', (e) => {
        const items = [{ value: '', label: 'Nenhum', hint: 'Escolha módulo por módulo' }, { sep: true },
          ...allModels().map((md) => ({ value: md.id, label: md.name, hint: md.desc }))];
        openPop(e.currentTarget, items, b.base || '', (v) => {
          b.base = v || null;
          const md = b.base ? allModels().find((x) => x.id === b.base) : null;
          PLAN_MODULES.forEach((id) => {
            const src = md && md.modules[id];
            if (!src || !src.enabled) { b.plan[id] = 'off'; return; }
            const fake = { enabled: true, settings: { ...MOD[id].defaults, ...src.settings } };
            const pid = presetOf(MOD[id], fake);
            b.plan[id] = pid === 'custom' || pid === 'on' ? 'model' : pid;
          });
          render();
        });
      });
      modal.querySelectorAll('[data-plan]').forEach((btn) => btn.addEventListener('click', (e) => {
        const id = btn.dataset.plan;
        const items = moduleOptions(MOD[id]);
        if (b.plan[id] === 'model') items.splice(1, 0, { value: 'model', label: 'Do modelo', hint: 'Mantém a configuração do modelo' });
        openPop(e.currentTarget, items, b.plan[id], (v) => { b.plan[id] = v; render(); });
      }));
    }
  }

  function create() {
    const rows = validRows();
    if (!rows.length) return toast('Nenhuma conta nova para adicionar', 'err');
    const md = b.base ? allModels().find((x) => x.id === b.base) : null;
    rows.forEach((r) => {
      const key = accountKey(r.world, r.nick);
      state.profiles[key] = newProfile();
      if (md) applyModel(key, md);
      const p = state.profiles[key];
      PLAN_MODULES.forEach((id) => {
        if (b.plan[id] !== 'model') applyPreset(p.modules[id], MOD[id], b.plan[id]);
      });
      setTestMode(key, b.test);
    });
    state.selected = accountKey(rows[0].world, rows[0].nick);
    addLog(`${rows.length} conta(s) adicionada(s) em massa`);
    toast(`${rows.length} conta(s) adicionada(s)`);
    closeModal();
    renderAll();
  }

  openModal(`
    ${modalHead('stack', 'Adicionar contas em massa', 'Cole a lista, revise e escolha o que cada conta vai automatizar.')}
    <div id="b-stepper"></div>
    <div class="modal-body"></div>
    <div class="modal-foot">
      <span class="foot-note" id="b-summary"></span>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="b-back" type="button">Voltar</button>
      <button class="btn btn-ember" id="b-next" type="button"></button>
    </div>`, {
    onMount(root) {
      root.querySelector('#b-back').addEventListener('click', () => { b.step = 1; render(); });
      root.querySelector('#b-next').addEventListener('click', () => {
        if (b.step === 1) {
          if (!validRows().length) return toast('Cole pelo menos uma conta nova válida', 'err');
          b.step = 2;
          render();
        } else {
          create();
        }
      });
      render();
    },
  });
}

// ---- Modelo de tropas (auto-farm) ----
function openTemplateEditor(moduleId, existingTpl) {
  const key = state.selected;
  const isNew = !existingTpl;
  const units = { ...(existingTpl ? existingTpl.units : {}) };

  openModal(`
    ${modalHead('target', isNew ? 'Novo modelo de tropas' : `Editar "${esc(existingTpl.name)}"`, 'É este modelo que o Auto Farm usa para enviar — a mudança chega no jogo em segundos.')}
    <div class="modal-body">
      <label><span class="field-label">Nome do modelo</span><input class="field" id="t-name" placeholder="Ex.: Padrão, Limpeza, Pesado" value="${existingTpl ? esc(existingTpl.name) : ''}" autocomplete="off"></label>
      <div class="tpl-unit-grid" style="margin-top:16px" id="t-units"></div>
    </div>
    <div class="modal-foot"><span class="spacer"></span>
      <button class="btn-ghost" data-close type="button">Cancelar</button>
      <button class="btn-primary" id="t-save" type="button">${icon('check', 'sm')}Salvar modelo</button>
    </div>`, {
    onMount(root) {
      const grid = root.querySelector('#t-units');
      grid.innerHTML = ATTACK_UNITS.map((u) => `
        <label>${esc(u.label)}<input class="field" type="number" min="0" step="1" inputmode="numeric" data-unit="${u.value}" value="${units[u.value] || ''}" placeholder="0"></label>
      `).join('');

      const save = () => {
        const name = root.querySelector('#t-name').value.trim();
        if (!name) return toast('Dê um nome ao modelo', 'err');
        const newUnits = {};
        let any = false;
        grid.querySelectorAll('[data-unit]').forEach((inp) => {
          const n = Math.max(0, Math.round(Number(inp.value) || 0));
          if (n > 0) { newUnits[inp.dataset.unit] = n; any = true; }
        });
        if (!any) return toast('Informe ao menos 1 tropa', 'err');

        const cfg = state.profiles[key].modules[moduleId];
        cfg.settings.templates = cfg.settings.templates || [];
        if (isNew) {
          const id = 'tpl_' + Math.random().toString(36).slice(2, 10);
          cfg.settings.templates.push({ id, name, units: newUnits });
          if (!cfg.settings.activeTemplateId) cfg.settings.activeTemplateId = id;
        } else {
          const t = cfg.settings.templates.find((x) => x.id === existingTpl.id);
          t.name = name;
          t.units = newUnits;
        }
        touch(key);
        rerenderTile(moduleId);
        refreshChrome();
        toast(isNew ? 'Modelo criado' : 'Modelo atualizado');
        closeModal();
      };
      root.querySelector('#t-save').addEventListener('click', save);
      root.querySelector('#t-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
    },
  });
}

// ---- Salvar como modelo ----
function openSaveModel() {
  const key = state.selected;
  openModal(`
    ${modalHead('bookmark', 'Salvar como modelo', 'Os módulos ligados desta conta viram uma receita reutilizável.')}
    <div class="modal-body">
      <label><span class="field-label">Nome do modelo</span><input class="field" id="m-name" placeholder="Ex.: Farm noturno" autocomplete="off"></label>
      <p class="note" style="margin-top:10px">O modo teste e o webhook do Discord não entram no modelo.</p>
    </div>
    <div class="modal-foot"><span class="spacer"></span>
      <button class="btn btn-ghost" data-close type="button">Cancelar</button>
      <button class="btn btn-ember" id="m-save" type="button">Salvar modelo</button>
    </div>`, {
    narrow: true,
    onMount(root) {
      const save = () => {
        const name = root.querySelector('#m-name').value.trim();
        if (!name) return toast('Dê um nome ao modelo', 'err');
        const md = modelFromProfile(name, state.profiles[key]);
        if (!Object.keys(md.modules).length) return toast('Ligue pelo menos um módulo antes', 'err');
        state.models.push(md);
        persistLocal();
        addLog(`Modelo "${name}" criado`);
        toast('Modelo salvo');
        closeModal();
        renderAside();
      };
      root.querySelector('#m-save').addEventListener('click', save);
      root.querySelector('#m-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
    },
  });
}

// ---- Remover ----
function confirmRemove(keys) {
  const names = keys.map((k) => splitKey(k).nick);
  openModal(`
    ${modalHead('trash', keys.length > 1 ? `Remover ${keys.length} contas?` : 'Remover conta?', esc(names.slice(0, 4).join(', ') + (names.length > 4 ? '…' : '')))}
    <div class="modal-body"><p class="note">O perfil sai do painel${bridge.connected ? ' e do Tampermonkey' : ''}. As configurações já aplicadas no jogo continuam valendo até você mudá-las lá.</p></div>
    <div class="modal-foot"><span class="spacer"></span>
      <button class="btn btn-ghost" data-close type="button">Cancelar</button>
      <button class="btn btn-danger" id="r-ok" type="button">${icon('trash', 'sm')}Remover</button>
    </div>`, {
    narrow: true,
    onMount(root) {
      root.querySelector('#r-ok').addEventListener('click', async () => {
        keys.forEach((k) => {
          delete state.profiles[k];
          delete state.accounts[k];
          state.checked.delete(k);
        });
        if (keys.includes(state.selected)) state.selected = null;
        if (bridge.connected) {
          for (const k of keys) { try { await bridgeCall('forgetAccount', { key: k }); } catch { /* segue */ } }
        }
        scheduleSave();
        addLog(`${keys.length} conta(s) removida(s)`);
        toast(keys.length > 1 ? 'Contas removidas' : 'Conta removida');
        closeModal();
        renderAll();
      });
    },
  });
}

// ---- Código de sincronização ----
function openSyncCode() {
  const code = 'TWS1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, profiles: state.profiles }))));
  openModal(`
    ${modalHead('key', 'Código de sincronização', 'Para quando o Tampermonkey não consegue ler este arquivo diretamente.')}
    <div class="modal-body">
      <ol class="steps" style="margin-top:0">
        <li><span>Copie o código abaixo.</span></li>
        <li><span>No jogo, abra o painel <code>TW Suite</code> e clique em <code>Importar código do dashboard</code>.</span></li>
        <li><span>Cole e recarregue a página do jogo.</span></li>
      </ol>
      <div class="card" style="max-height:160px; overflow:auto"><div class="codebox">${esc(code)}</div></div>
      <p class="note" style="margin-top:10px">${Object.keys(state.profiles).length} perfil(is) · o código inclui webhooks do Discord, não compartilhe.</p>
    </div>
    <div class="modal-foot"><span class="spacer"></span>
      <button class="btn btn-ghost" data-close type="button">Fechar</button>
      <button class="btn btn-ember" id="c-copy" type="button">${icon('copy', 'sm')}Copiar código</button>
    </div>`, {
    onMount(root) {
      root.querySelector('#c-copy').addEventListener('click', () => {
        copyText(code).then(() => toast('Código copiado')).catch(() => toast('Não foi possível copiar', 'err'));
      });
    },
  });
}

// ---- Backup ----
function exportBackup() {
  const data = { kind: 'tw-suite-backup', v: 2, exportedAt: new Date().toISOString(), profiles: state.profiles, models: state.models };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tw-suite-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  addLog('Backup exportado');
  toast('Backup exportado');
}

function importBackup(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      let count = 0;
      if (data.kind === 'tw-suite-backup') {
        for (const [k, p] of Object.entries(data.profiles || {})) {
          state.profiles[k] = { ...p, updatedAt: Date.now() };
          normalizeProfile(k);
          count++;
        }
        const ids = new Set(state.models.map((m) => m.id));
        (data.models || []).forEach((m) => { if (!ids.has(m.id)) state.models.push(m); });
      } else if (data.account && data.config) {
        state.profiles[accountKey(data.account.server, data.account.nick)] = profileFromLegacy(data.config);
        count = 1;
      } else if (data.accounts) {
        for (const [k, cfg] of Object.entries(data.accounts)) {
          const { world, nick } = splitKey(k);
          state.profiles[accountKey(world, nick)] = profileFromLegacy(cfg);
          count++;
        }
      } else {
        throw new Error('formato não reconhecido');
      }
      scheduleSave();
      addLog(`${count} perfil(is) importado(s)`);
      toast(`${count} perfil(is) importado(s)`);
      renderAll();
    } catch (err) {
      toast(`Falha ao importar: ${err.message}`, 'err');
    }
  };
  reader.readAsText(file);
}

// ---- Paleta de comandos ----
function openPalette() {
  const commands = () => {
    const list = [
      { sec: 'Ações', label: 'Nova conta', icon: 'plus', run: openAddOne },
      { sec: 'Ações', label: 'Adicionar contas em massa', icon: 'stack', run: openBulk },
      { sec: 'Ações', label: 'Código de sincronização', icon: 'key', run: openSyncCode },
      { sec: 'Ações', label: 'Exportar backup', icon: 'down', run: exportBackup },
      { sec: 'Ações', label: 'Importar backup', icon: 'up', run: () => $('#importFile').click() },
    ];
    if (state.selected) {
      const nick = splitKey(state.selected).nick;
      const ts = testState(state.profiles[state.selected]);
      list.push({ sec: 'Ações', label: ts === 'true' ? `Mudar ${nick} para modo real` : `Colocar ${nick} em modo teste`, icon: ts === 'true' ? 'bolt' : 'flask', run: () => handleAct('test-toggle') });
      list.push({ sec: 'Ações', label: `Salvar ${nick} como modelo`, icon: 'bookmark', run: openSaveModel });
    }
    allKeys().forEach((k) => {
      const { world, nick } = splitKey(k);
      list.push({ sec: 'Contas', label: nick, meta: world, icon: 'pin', run: () => selectAccount(k) });
    });
    return list;
  };

  let hl = 0;
  let items = [];

  openModal(`
    <div class="palette-input">${icon('search')}<input id="p-q" placeholder="Buscar conta ou comando…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
    <div class="palette-list" id="p-list"></div>`, {
    palette: true,
    onMount(root) {
      const q = root.querySelector('#p-q');
      const listEl = root.querySelector('#p-list');
      const draw = () => {
        const term = q.value.trim().toLowerCase();
        items = commands().filter((c) => !term || `${c.label} ${c.meta || ''}`.toLowerCase().includes(term));
        hl = Math.min(hl, Math.max(0, items.length - 1));
        let sec = '';
        listEl.innerHTML = items.length ? items.map((c, i) => {
          const head = c.sec !== sec ? `<div class="palette-sec">${c.sec}</div>` : '';
          sec = c.sec;
          return `${head}<button class="palette-item ${i === hl ? 'hl' : ''}" data-i="${i}" type="button">${icon(c.icon, 'sm')}<span>${esc(c.label)}</span>${c.meta ? `<small>${esc(c.meta)}</small>` : ''}</button>`;
        }).join('') : '<div class="rail-empty">Nada encontrado.</div>';
        const cur = listEl.querySelector('.hl');
        if (cur) cur.scrollIntoView({ block: 'nearest' });
      };
      const run = (i) => {
        const c = items[i];
        if (!c) return;
        closeModal();
        setTimeout(c.run, 40);
      };
      q.addEventListener('input', () => { hl = 0; draw(); });
      q.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(items.length - 1, hl + 1); draw(); }
        if (e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(0, hl - 1); draw(); }
        if (e.key === 'Enter') { e.preventDefault(); run(hl); }
      });
      listEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-i]');
        if (b) run(Number(b.dataset.i));
      });
      draw();
    },
  });
}

// ------------------------------------------------------------------
// Atalhos globais
// ------------------------------------------------------------------
document.addEventListener('keydown', (e) => {
  if (pop.el) {
    const n = pop.items.length;
    if (e.key === 'Escape') { e.preventDefault(); closePop(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); pop.hl = (pop.hl + 1) % n; highlightPop(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); pop.hl = (pop.hl - 1 + n) % n; highlightPop(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      const it = pop.items[pop.hl];
      const cb = pop.onPick;
      closePop();
      if (it && cb) cb(it.value);
      return;
    }
  }
  if (e.key === 'Escape' && scrim.classList.contains('show')) { closeModal(); return; }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (!scrim.classList.contains('show')) openPalette();
    return;
  }
  if (e.key === '/' && !typing && !scrim.classList.contains('show')) {
    e.preventDefault();
    $('#railSearch').focus();
  }
});

// Início
// ------------------------------------------------------------------
loadLocal();
renderAll();
setInterval(renderRail, 60000);
setInterval(async () => {
  if (!bridge.connected) return;
  try {
    await pullFromBridge();
    renderRail();
    refreshChrome();
  } catch { /* falha temporária — tenta de novo no próximo ciclo */ }
}, 20000);
[0, 500, 1500, 4000].forEach((ms) => setTimeout(() => { if (!bridge.connected) connectBridge(); }, ms));
})();
