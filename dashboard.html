<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TW Suite · Sala de Guerra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink-0: #0b0a09;
  --ink-1: #12110f;
  --ink-2: #1a1815;
  --ink-3: #24211d;
  --ink-4: #2f2b26;
  --line: rgba(236, 220, 190, 0.07);
  --line-2: rgba(236, 220, 190, 0.13);
  --line-3: rgba(236, 220, 190, 0.22);
  --text: #efe7d8;
  --text-2: #b8ae9c;
  --text-3: #7f7668;
  --ember: #e9a54b;
  --ember-2: #d8712d;
  --ember-soft: rgba(233, 165, 75, 0.12);
  --ember-glow: rgba(233, 165, 75, 0.38);
  --jade: #6cc4a6;
  --jade-soft: rgba(108, 196, 166, 0.12);
  --rose: #e46a5c;
  --rose-soft: rgba(228, 106, 92, 0.12);
  --serif: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --sans: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7), 0 2px 0 rgba(255, 240, 210, 0.02) inset;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink-0);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(233, 165, 75, 0.10), transparent 60%),
    radial-gradient(700px 500px at 100% 110%, rgba(108, 196, 166, 0.05), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 47px, rgba(236, 220, 190, 0.028) 47px 48px),
    repeating-linear-gradient(90deg, transparent 0 47px, rgba(236, 220, 190, 0.028) 47px 48px);
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55));
  z-index: 0;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
::selection { background: var(--ember-glow); color: #fff; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 15px; height: 15px; }
.ico.lg { width: 22px; height: 22px; }
.mono { font-family: var(--mono); font-feature-settings: 'zero' 1; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- App shell ---------- */
.app {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(to bottom, rgba(11, 10, 9, 0.9), rgba(11, 10, 9, 0.6));
  backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; }
.brand-name { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.brand-name em { font-style: italic; font-weight: 400; color: var(--ember); }
.brand-sub { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; }

.cmdk {
  flex: 1;
  max-width: 460px;
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border: 1px solid var(--line-2);
  border-radius: 11px;
  background: rgba(26, 24, 21, 0.6);
  color: var(--text-3);
  text-align: left;
  transition: border-color .2s, background .2s;
}
.cmdk:hover { border-color: var(--line-3); background: var(--ink-2); color: var(--text-2); }
.cmdk span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd {
  white-space: nowrap;
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 5px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  color: var(--text-2);
  background: var(--ink-1);
}

.sync-pill {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 13px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  font-size: 12.5px;
  color: var(--text-2);
  white-space: nowrap;
}
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); position: relative; }
.sync-pill.on .sync-dot { background: var(--jade); }
.sync-pill.on .sync-dot::after {
  content: ''; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid var(--jade); animation: ping 2.2s cubic-bezier(0, 0, .2, 1) infinite;
}
.sync-pill.saving .sync-dot { background: var(--ember); }
@keyframes ping { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line-2); color: var(--text-2);
  transition: all .2s; white-space: nowrap;
}
.icon-btn:hover { color: var(--text); border-color: var(--line-3); background: var(--ink-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 11px;
  font-weight: 600; font-size: 13.5px; white-space: nowrap;
  transition: transform .15s, box-shadow .2s, background .2s, border-color .2s, color .2s;
}
.btn:active { transform: translateY(1px); }
.btn-ember {
  color: #1b1208;
  background: linear-gradient(180deg, #f2b560, var(--ember) 45%, var(--ember-2));
  box-shadow: 0 0 0 1px rgba(255, 210, 150, 0.35) inset, 0 10px 30px -10px var(--ember-glow);
}
.btn-ember:hover { box-shadow: 0 0 0 1px rgba(255, 220, 170, 0.5) inset, 0 14px 36px -10px var(--ember-glow); }
.btn-ghost { border: 1px solid var(--line-2); color: var(--text); background: rgba(26, 24, 21, 0.5); }
.btn-ghost:hover { border-color: var(--line-3); background: var(--ink-2); }
.btn-danger { border: 1px solid rgba(228, 106, 92, 0.35); color: var(--rose); }
.btn-danger:hover { background: var(--rose-soft); }
.btn-sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 9px; }

.layout {
  min-height: 0;
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr) 320px;
}

/* ---------- Rail (fleet) ---------- */
.rail {
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: rgba(18, 17, 15, 0.55);
}
.rail-head { padding: 20px 18px 12px; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.rail-title { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
.rail-title h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; letter-spacing: -0.01em; }
.rail-title .count { font-family: var(--mono); color: var(--text-3); font-size: 12px; }
.rail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.search {
  margin-top: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 10px; height: 36px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--ink-1); color: var(--text-3);
}
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font-size: 13px; }
.chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.chip {
  padding: 4px 10px; border-radius: 999px; font-size: 12px; color: var(--text-3);
  border: 1px solid var(--line); transition: all .2s;
}
.chip:hover { color: var(--text-2); border-color: var(--line-2); }
.chip.on { color: var(--ember); border-color: rgba(233, 165, 75, 0.4); background: var(--ember-soft); }

.rail-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 10px 90px; display: flex; flex-direction: column; gap: 6px; }
.acct {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: 12px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  outline: none;
}
.acct:hover { background: rgba(36, 33, 29, 0.55); }
.acct:focus-visible { border-color: var(--ember); }
.acct.active {
  background: linear-gradient(90deg, rgba(233, 165, 75, 0.10), rgba(36, 33, 29, 0.4));
  border-color: rgba(233, 165, 75, 0.28);
}
.acct.active::before {
  content: ''; position: absolute; left: -10px; top: 14px; bottom: 14px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--ember); box-shadow: 0 0 14px var(--ember-glow);
}
.seal {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 11px;
  border: 1px solid var(--line-2);
  background: radial-gradient(circle at 30% 20%, rgba(233, 165, 75, 0.16), transparent 70%), var(--ink-2);
  font-family: var(--mono); line-height: 1; text-align: center; position: relative;
}
.seal small { display: block; font-size: 9px; letter-spacing: .12em; color: var(--text-3); text-transform: uppercase; }
.seal b { display: block; font-size: 14px; font-weight: 600; color: var(--ember); margin-top: 3px; }
.seal .check {
  position: absolute; inset: -1px; border-radius: 11px; display: none; place-items: center;
  background: var(--ember); color: #1b1208;
}
.acct.checked .seal .check { display: grid; }
.acct-body { min-width: 0; }
.acct-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-meta { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-dots { display: flex; gap: 3px; margin-top: 6px; }
.acct-dots i { width: 14px; height: 3px; border-radius: 3px; background: var(--ink-4); }
.acct-dots i.on { background: var(--ember); box-shadow: 0 0 6px var(--ember-glow); }
.acct-dots i.on.test { background: repeating-linear-gradient(90deg, var(--ember) 0 3px, transparent 3px 5px); box-shadow: none; }
.tag {
  font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
  padding: 3px 7px; border-radius: 6px; white-space: nowrap;
}
.tag-test { color: var(--ember); background: var(--ember-soft); }
.tag-live { color: var(--jade); background: var(--jade-soft); }
.tag-off { color: var(--text-3); background: var(--ink-3); }

.rail-empty { padding: 30px 14px; text-align: center; color: var(--text-3); font-size: 13px; }

/* ---------- Main ---------- */
.main { min-height: 0; overflow-y: auto; padding: 30px clamp(18px, 3vw, 42px) 120px; }

.hero { position: relative; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
.hero-kicker { display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: 12px; }
.hero-kicker .world { font-family: var(--mono); color: var(--ember); letter-spacing: .08em; }
.hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 6px; }
.hero-title {
  font-family: var(--serif); font-weight: 400; letter-spacing: -0.025em;
  font-size: clamp(38px, 5vw, 64px); line-height: 1; word-break: break-word;
}
.hero-title em { font-style: italic; color: var(--ember); }
.hero-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin-top: 26px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: rgba(18, 17, 15, 0.92); padding: 16px 18px; min-width: 0; }
.stat .k { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.stat .v { font-family: var(--mono); font-size: 26px; font-weight: 500; margin-top: 6px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v small { font-size: 14px; color: var(--text-3); }
.stat .h { font-size: 11.5px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 4px; background: var(--ink-3); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember-2), var(--ember)); border-radius: 4px; transition: width .4s; }

.livecard { margin-top: 14px; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: rgba(26, 24, 21, 0.55); }
.livecard-empty { display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: 12.5px; }
.livecard-empty .ico { color: var(--ember); flex: none; }
.livecard-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.livecard-head b { display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.livebars { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
.livebar { display: grid; grid-template-columns: 60px 1fr 70px; align-items: center; gap: 10px; font-size: 12px; }
.livebar-label { color: var(--text-3); }
.livebar-track { height: 6px; border-radius: 4px; background: var(--ink-3); overflow: hidden; }
.livebar-track i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember-2), var(--ember)); border-radius: 4px; }
.livebar-val { text-align: right; font-family: var(--mono); color: var(--text-2); }
.livetroops { display: flex; flex-wrap: wrap; gap: 6px; }
.troop-chip { padding: 4px 9px; border-radius: 999px; background: var(--ink-3); font-size: 12px; font-family: var(--mono); }
.troop-chip small { font-family: var(--sans); color: var(--text-3); margin-left: 3px; }

.testband {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-top: 18px; padding: 14px 16px; border-radius: var(--radius);
  border: 1px solid rgba(233, 165, 75, 0.25);
  background:
    repeating-linear-gradient(-45deg, rgba(233, 165, 75, 0.05) 0 10px, transparent 10px 20px),
    rgba(26, 24, 21, 0.7);
}
.testband.live { border-color: rgba(108, 196, 166, 0.25); background: rgba(108, 196, 166, 0.05); }
.testband-text { flex: 1; min-width: 220px; }
.testband-text b { display: block; font-weight: 600; }
.testband-text span { font-size: 12.5px; color: var(--text-2); }

/* lever switch */
.lever {
  position: relative; width: 48px; height: 26px; border-radius: 999px; flex: none;
  background: var(--ink-4); border: 1px solid var(--line-2);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
  transition: background .25s, border-color .25s;
}
.lever::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: linear-gradient(180deg, #d8cfbf, #9d9383);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.15);
  transition: transform .3s cubic-bezier(.3, 1.5, .5, 1), background .25s;
}
.lever[aria-checked="true"] { background: linear-gradient(90deg, var(--ember-2), var(--ember)); border-color: rgba(255, 210, 150, 0.4); }
.lever[aria-checked="true"]::after { transform: translateX(22px); background: linear-gradient(180deg, #fff7e8, #f0dcc0); }
.lever[aria-checked="mixed"]::after { transform: translateX(11px); }
.lever.jade[aria-checked="true"] { background: linear-gradient(90deg, #3e9b7c, var(--jade)); border-color: rgba(160, 230, 205, 0.4); }
.lever.sm { width: 38px; height: 21px; }
.lever.sm::after { width: 15px; height: 15px; }
.lever.sm[aria-checked="true"]::after { transform: translateX(17px); }

/* switchboard */
.group { margin-top: 38px; }
.group-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
.group-num { font-family: var(--serif); font-style: italic; color: var(--ember); font-size: 22px; }
.group-name { font-family: var(--serif); font-size: 24px; font-weight: 400; letter-spacing: -0.01em; }
.group-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); align-self: center; }
.group-count { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }

.tile {
  position: relative; display: flex; flex-direction: column; gap: 12px;
  padding: 18px; border-radius: var(--radius);
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(26, 24, 21, 0.85), rgba(18, 17, 15, 0.85));
  box-shadow: var(--shadow);
  transition: border-color .3s, transform .3s;
  overflow: hidden;
}
.tile::before {
  content: ''; position: absolute; left: 18px; right: 18px; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-3), transparent);
  transition: background .3s, box-shadow .3s;
}
.tile:hover { border-color: var(--line-2); }
.tile.on { border-color: rgba(233, 165, 75, 0.26); }
.tile.on::before { background: linear-gradient(90deg, transparent, var(--ember), transparent); box-shadow: 0 0 22px 2px var(--ember-glow); }
.tile-top { display: flex; align-items: flex-start; gap: 12px; }
.tile-icon {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none;
  color: var(--text-2); background: var(--ink-3); border: 1px solid var(--line);
  transition: color .3s, background .3s;
}
.tile.on .tile-icon { color: var(--ember); background: var(--ember-soft); border-color: rgba(233, 165, 75, 0.22); }
.tile-name { flex: 1; min-width: 0; }
.tile-name h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
.tile-name p { font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.tile-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.55; }

.picker {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 12px; border-radius: 10px; text-align: left;
  border: 1px solid var(--line-2); background: var(--ink-1);
  transition: border-color .2s, background .2s;
}
.picker:hover { border-color: var(--line-3); background: var(--ink-2); }
.picker .pk-l { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.picker .pk-v { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.picker .pk-v b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker .pk-v span { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker .ico { color: var(--text-3); }

.tpl-box { border-top: 1px dashed var(--line-2); padding-top: 10px; margin-top: 2px; }
.tpl-list { display: flex; flex-direction: column; gap: 6px; }
.tpl-row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--ink-1); }
.tpl-row.active { border-color: rgba(233, 165, 75, 0.4); background: var(--ember-soft); }
.tpl-pick { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); border: 1px solid var(--line-2); flex: none; }
.tpl-row.active .tpl-pick { color: var(--ember); border-color: rgba(233, 165, 75, 0.5); }
.tpl-name { font-size: 13px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: baseline; gap: 8px; }
.tpl-name small { font-weight: 400; color: var(--text-3); font-size: 11px; white-space: nowrap; }
.tpl-unit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tpl-unit-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--text-2); }

.fine-wrap { border-top: 1px dashed var(--line-2); padding-top: 10px; }
.fine-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); padding: 2px 0; }
.fine-toggle:hover { color: var(--text-2); }
.fine-toggle .ico { transition: transform .25s; }
.fine-wrap.open .fine-toggle .ico { transform: rotate(180deg); }
.fine-body { display: none; flex-direction: column; gap: 14px; padding-top: 12px; }
.fine-wrap.open .fine-body { display: flex; }
.fine { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--text-2); }
.fine-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.fine-top output { font-family: var(--mono); color: var(--text); font-size: 12.5px; }
.fine-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
.note { font-size: 12px; color: var(--text-3); line-height: 1.5; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--ember) var(--p), var(--ink-4) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--ink-4); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--ember); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #f3e6cf; border: 3px solid var(--ember); box-shadow: 0 0 0 4px rgba(233, 165, 75, 0.15); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #f3e6cf; border: 3px solid var(--ember); }

.field {
  width: 100%; height: 40px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--ink-1); color: var(--text); outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.field:focus { border-color: rgba(233, 165, 75, 0.6); box-shadow: 0 0 0 3px var(--ember-soft); }
textarea.field { height: auto; padding: 12px; resize: vertical; font-family: var(--mono); font-size: 13px; line-height: 1.6; }
.field-label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); font-weight: 600; margin-bottom: 7px; display: block; }

/* ---------- Aside ---------- */
.aside { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: rgba(18, 17, 15, 0.55); padding: 20px 18px 40px; display: flex; flex-direction: column; gap: 16px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(26, 24, 21, 0.6); padding: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card-head h4 { font-family: var(--serif); font-weight: 400; font-size: 18px; }
.sync-hero { display: flex; align-items: center; gap: 12px; }
.sync-orb { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ink-3); color: var(--text-3); border: 1px solid var(--line-2); }
.sync-orb.on { color: var(--jade); background: var(--jade-soft); border-color: rgba(108, 196, 166, 0.35); box-shadow: 0 0 24px -4px rgba(108, 196, 166, 0.45); }
.sync-hero b { display: block; font-weight: 600; }
.sync-hero span { font-size: 12px; color: var(--text-3); }
.steps { list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 9px; margin: 14px 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 9px; font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
.steps li::before { content: counter(s); font-family: var(--mono); font-size: 11px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); color: var(--ember); }
.steps code { font-family: var(--mono); font-size: 11.5px; color: var(--text); background: var(--ink-3); padding: 1px 5px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; }
.kv div { background: var(--ink-1); padding: 10px 12px; }
.kv b { display: block; font-family: var(--mono); font-size: 20px; font-weight: 500; }
.kv span { font-size: 11px; color: var(--text-3); }
.model { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.model:first-of-type { border-top: 0; padding-top: 0; }
.model-body { flex: 1; min-width: 0; }
.model-body b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-body span { font-size: 11.5px; color: var(--text-3); }
.log { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.log li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: 12px; color: var(--text-2); }
.log time { font-family: var(--mono); color: var(--text-3); font-size: 11px; padding-top: 1px; }

/* ---------- Empty state ---------- */
.empty { min-height: 70vh; display: grid; place-items: center; text-align: center; }
.empty-inner { max-width: 560px; }
.empty-mark { width: 84px; height: 84px; margin: 0 auto 22px; }
.empty h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 4.5vw, 52px); line-height: 1.05; letter-spacing: -0.02em; }
.empty h1 em { color: var(--ember); }
.empty p { color: var(--text-2); margin: 14px auto 26px; max-width: 460px; }
.empty-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---------- Bulk bar ---------- */
.bulkbar {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 140%); z-index: 40;
  display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 16px;
  border-radius: 16px; border: 1px solid var(--line-2);
  background: rgba(26, 24, 21, 0.92); backdrop-filter: blur(16px);
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
  transition: transform .35s cubic-bezier(.2, .9, .3, 1.2), visibility 0s .35s;
  max-width: calc(100vw - 32px); overflow-x: auto; visibility: hidden;
}
.bulkbar.show { transform: translate(-50%, 0); visibility: visible; transition: transform .35s cubic-bezier(.2, .9, .3, 1.2); }
.bulkbar .n { font-family: var(--mono); color: var(--ember); margin-right: 8px; white-space: nowrap; font-size: 13px; }
.bulkbar .sep { width: 1px; align-self: stretch; background: var(--line-2); margin: 4px 4px; }

/* ---------- Modals ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px;
  background: rgba(5, 4, 3, 0.66); backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.scrim.show { opacity: 1; pointer-events: auto; }
.modal {
  width: min(720px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  border-radius: 20px; border: 1px solid var(--line-2);
  background: linear-gradient(180deg, #1c1a17, #131210);
  box-shadow: 0 40px 100px -30px rgba(0, 0, 0, 0.9);
  transform: translateY(14px) scale(.98); transition: transform .3s cubic-bezier(.2, .9, .3, 1.1);
  overflow: hidden;
}
.scrim.show .modal { transform: none; }
.modal.narrow { width: min(460px, 100%); }
.modal-head { display: flex; align-items: flex-start; gap: 14px; padding: 22px 24px 16px; }
.modal-badge { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--ember-soft); color: var(--ember); border: 1px solid rgba(233, 165, 75, 0.25); }
.modal-head h3 { font-family: var(--serif); font-weight: 400; font-size: 25px; letter-spacing: -0.01em; line-height: 1.15; }
.modal-head p { color: var(--text-3); font-size: 13px; margin-top: 3px; }
.modal-head .x { margin-left: auto; color: var(--text-3); width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.modal-head .x:hover { background: var(--ink-3); color: var(--text); }
.modal-body { padding: 4px 24px 20px; overflow-y: auto; }
.modal-foot { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--line); background: rgba(11, 10, 9, 0.4); flex-wrap: wrap; }
.modal-foot .spacer { flex: 1; }
.foot-note { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.foot-note .ico { color: var(--jade); }

.stepper { display: flex; align-items: center; gap: 10px; padding: 0 24px 16px; }
.step { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-3); white-space: nowrap; }
.step i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line-2); }
.step.cur { color: var(--text); }
.step.cur i { border-color: var(--ember); color: var(--ember); box-shadow: 0 0 0 4px var(--ember-soft); }
.step.done i { background: var(--ember); border-color: var(--ember); color: #1b1208; }
.step-line { flex: 1; height: 1px; background: var(--line-2); min-width: 20px; }
.step-line.done { background: var(--ember); }

.callout { display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(108, 196, 166, 0.22); background: var(--jade-soft); font-size: 12.5px; color: var(--text-2); margin-bottom: 16px; }
.callout .ico { color: var(--jade); margin-top: 1px; }
.callout b { color: var(--text); }
.callout code { font-family: var(--mono); font-size: 12px; color: var(--text); background: rgba(0, 0, 0, 0.3); padding: 1px 5px; border-radius: 4px; }
.callout.warn { border-color: rgba(233, 165, 75, 0.28); background: var(--ember-soft); }
.callout.warn .ico { color: var(--ember); }

.parse { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; max-height: 210px; overflow-y: auto; }
.parse-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.parse-row:first-child { border-top: 0; }
.parse-row .w { font-family: var(--mono); color: var(--ember); font-size: 12px; }
.parse-row.bad { color: var(--text-3); }
.parse-row.bad .w { color: var(--rose); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.plan { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.plan-card { border: 1px solid var(--line); border-radius: 13px; padding: 13px; background: rgba(11, 10, 9, 0.35); transition: border-color .25s; }
.plan-card.on { border-color: rgba(233, 165, 75, 0.3); }
.plan-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.plan-card-top .tile-icon { width: 34px; height: 34px; border-radius: 9px; }
.plan-card.on .tile-icon { color: var(--ember); background: var(--ember-soft); }
.plan-card-top b { display: block; font-size: 13.5px; font-weight: 600; }
.plan-card-top span { font-size: 11.5px; color: var(--text-3); }

.codebox { font-family: var(--mono); font-size: 12px; word-break: break-all; line-height: 1.6; color: var(--text-2); }

/* popover */
.pop {
  position: fixed; z-index: 90; min-width: 240px; max-width: 340px; max-height: 320px; overflow-y: auto;
  padding: 6px; border-radius: 13px; border: 1px solid var(--line-2);
  background: rgba(28, 26, 23, 0.98); backdrop-filter: blur(12px);
  box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.85);
  opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .15s, transform .15s;
}
.pop.show { opacity: 1; transform: none; pointer-events: auto; }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 9px; text-align: left; }
.pop-item:hover, .pop-item.hl { background: var(--ink-3); }
.pop-item .pv { flex: 1; min-width: 0; }
.pop-item .pv b { display: block; font-weight: 600; font-size: 13px; }
.pop-item .pv span { display: block; font-size: 11.5px; color: var(--text-3); }
.pop-item .tick { color: var(--ember); visibility: hidden; }
.pop-item.sel .tick { visibility: visible; }
.pop-sep { height: 1px; background: var(--line); margin: 5px 4px; }

/* palette */
.palette { width: min(620px, 100%); align-self: start; margin-top: 12vh; }
.palette-input { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); color: var(--text-3); }
.palette-input input { flex: 1; background: none; border: 0; outline: 0; font-size: 17px; color: var(--text); }
.palette-list { max-height: 380px; overflow-y: auto; padding: 8px; }
.palette-sec { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); padding: 10px 10px 6px; font-weight: 600; }
.palette-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 10px; text-align: left; color: var(--text-2); }
.palette-item.hl { background: var(--ink-3); color: var(--text); }
.palette-item .ico { color: var(--text-3); }
.palette-item.hl .ico { color: var(--ember); }
.palette-item span { flex: 1; }
.palette-item small { font-family: var(--mono); font-size: 11px; color: var(--text-3); }

/* toasts */
.toasts { position: fixed; top: 76px; right: 22px; z-index: 100; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--line-2); background: rgba(28, 26, 23, 0.96); backdrop-filter: blur(12px);
  box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.8); font-size: 13px; max-width: 360px;
  animation: tin .35s cubic-bezier(.2, .9, .3, 1.2);
}
.toast .ico { color: var(--jade); }
.toast.err .ico { color: var(--rose); }
.toast.out { animation: tout .25s forwards; }
@keyframes tin { from { opacity: 0; transform: translateX(20px); } }
@keyframes tout { to { opacity: 0; transform: translateX(20px); } }

.reveal { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 1280px) {
  .layout { grid-template-columns: 300px minmax(0, 1fr); }
  .aside { display: none; }
  .aside-inline { display: flex !important; }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .cmdk kbd { display: none; }
  .hero-row { align-items: flex-start; flex-direction: column; }
}
@media (max-width: 600px) {
  .brand-name { font-size: 16px; }
  .brand-name em { display: none; }
  #syncText { display: none; }
  .sync-pill { padding: 10px; }
  .rail-head, .main { padding-left: 16px; padding-right: 16px; }
  .stat .v { font-size: 21px; }
  .rail-list { max-height: 300px; padding-bottom: 12px; }
  .main { overflow: visible; padding-bottom: 120px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brand-sub, .cmdk span, .hide-sm { display: none; }
  .cmdk { flex: 0; margin-left: auto; }
  .topbar { padding: 12px 16px; gap: 10px; }
  .plan, .row2 { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr; }
}
.aside-inline { display: none; flex-direction: column; gap: 16px; margin-top: 40px; }
</style>

const LEGACY_PREFIX = 'tw-suite-config:';

const state = {
  profiles: {},
  accounts: {},
  models: [],
  selected: null,
  checked: new Set(),

const clone = (o) => JSON.parse(JSON.stringify(o));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const icon = (name, cls = '') => `<svg class="ico ${cls}"><use href="#i-${name}"/></svg>`;
const fmt = (n) => Number(n || 0).toLocaleString('pt-BR');

function lsRead(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function lsWrite(key, val) {
  try { localStorage.setItem(key, val); return true; } catch { return false; }
}

function loadLocal() {
  const raw = lsRead(LS_KEY);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      state.profiles = data.profiles || {};
      state.accounts = data.accounts || {};
      state.models = data.models || [];
      state.selected = data.selected || null;
    } catch { /* estado corrompido: começa vazio */ }
  }
  migrateLegacy();
  Object.keys(state.profiles).forEach(normalizeProfile);
}

function migrateLegacy() {
  let migrated = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(LEGACY_PREFIX)) continue;
      const [world, ...nickParts] = k.slice(LEGACY_PREFIX.length).split(':');
      const nick = nickParts.join(':');
      if (!world || !nick) continue;
      const key = accountKey(world, nick);
      if (state.profiles[key]) continue;
      const cfg = JSON.parse(localStorage.getItem(k) || '{}');
      state.profiles[key] = profileFromLegacy(cfg);
      migrated++;
    }
  } catch { /* sem acesso ao storage */ }
  if (migrated) addLog(`${migrated} conta(s) migrada(s) do dashboard antigo`);
}

function profileFromLegacy(cfg) {
  const p = newProfile();
  for (const [id, val] of Object.entries(cfg || {})) {
    if (!MOD[id] || !val || typeof val !== 'object') continue;
    const { enabled, ...settings } = val;
    p.modules[id].enabled = !!enabled;
    Object.assign(p.modules[id].settings, settings);
  }
  return p;
}

function persistLocal() {
  lsWrite(LS_KEY, JSON.stringify({
    profiles: state.profiles, accounts: state.accounts, models: state.models, selected: state.selected,
  }));
}

// ------------------------------------------------------------------
// Perfis
// ------------------------------------------------------------------
function accountKey(world, nick) {
  return `${String(world).trim().toLowerCase()}:${String(nick).trim()}`;
}
function splitKey(key) {
  const i = key.indexOf(':');
  return { world: key.slice(0, i), nick: key.slice(i + 1) };
}

function newProfile() {
  const modules = {};
  MODULES.forEach((m) => { modules[m.id] = { enabled: false, settings: clone(m.defaults) }; });
  return { updatedAt: Date.now(), modules };
}

function normalizeProfile(key) {
  const p = state.profiles[key];
  if (!p.modules) p.modules = {};
  MODULES.forEach((m) => {
    const cur = p.modules[m.id] || {};
    p.modules[m.id] = { enabled: !!cur.enabled, settings: { ...clone(m.defaults), ...(cur.settings || {}) } };
  });
}

function allKeys() {
  const keys = new Set([...Object.keys(state.profiles), ...Object.keys(state.accounts)]);
  keys.forEach((k) => { if (!state.profiles[k]) { state.profiles[k] = newProfile(); } });
  return [...keys].sort((a, b) => {
    const sa = state.accounts[a], sb = state.accounts[b];
    return ((sb && sb.lastSeen) || 0) - ((sa && sa.lastSeen) || 0) || a.localeCompare(b);
  });
}

function testState(profile) {
  const mods = MODULES.filter((m) => !m.noTestMode && 'dryRun' in m.defaults);
  const on = mods.filter((m) => profile.modules[m.id].settings.dryRun).length;
  if (on === mods.length) return 'true';
  if (on === 0) return 'false';
  return 'mixed';
}

function setTestMode(key, on) {
  const p = state.profiles[key];
  MODULES.forEach((m) => {
    if (!m.noTestMode && 'dryRun' in m.defaults) p.modules[m.id].settings.dryRun = on;
  });

}

function activeCount(profile) {
  return MODULES.filter((m) => profile.modules[m.id].enabled).length;

function presetOf(mod, cfg) {
  if (!cfg.enabled) return 'off';
  if (!mod.presets.length) return 'on';
  const hit = mod.presets.find((pr) => Object.entries(pr.settings).every(([k, v]) => cfg.settings[k] === v));
  return hit ? hit.id : 'custom';
}

function presetLabel(mod, cfg) {
  const id = presetOf(mod, cfg);
  if (id === 'off') return { title: 'Desligado', sub: 'Não roda nesta conta' };
  if (id === 'on') return { title: 'Ligado', sub: mod.hint(cfg.settings) };
  if (id === 'custom') return { title: 'Personalizado', sub: mod.hint(cfg.settings) };
  const pr = mod.presets.find((p) => p.id === id);
  return { title: pr.label, sub: mod.hint(cfg.settings) };
}

function applyPreset(cfg, mod, presetId) {
  if (presetId === 'off') { cfg.enabled = false; return; }
  cfg.enabled = true;
  const pr = mod.presets.find((p) => p.id === presetId);
  if (pr) Object.assign(cfg.settings, clone(pr.settings));
}

function applyModel(key, model) {
  const p = state.profiles[key];
  MODULES.forEach((m) => {
    const src = model.modules[m.id];
    const dry = p.modules[m.id].settings.dryRun;
    if (!src) {
      p.modules[m.id].enabled = false;
      return;
    }
    p.modules[m.id].enabled = !!src.enabled;
    Object.assign(p.modules[m.id].settings, clone(src.settings || {}));
    if ('dryRun' in m.defaults) p.modules[m.id].settings.dryRun = dry;
  });
  touch(key);
}

function modelFromProfile(name, profile) {
  const modules = {};
  MODULES.forEach((m) => {
    const cfg = profile.modules[m.id];
    if (!cfg.enabled) return;
    const { dryRun, webhookUrl, ...settings } = cfg.settings;
    modules[m.id] = { enabled: true, settings };
  });
  const n = Object.keys(modules).length;
  return { id: 'm-' + Math.random().toString(36).slice(2, 9), name, desc: `${n} módulo(s) ativo(s)`, modules };
}

const allModels = () => [...BUILTIN_MODELS, ...state.models];

// ------------------------------------------------------------------
// Ponte com o Tampermonkey (postMessage)
// ------------------------------------------------------------------
const bridge = { connected: false, version: null, seq: 0, pending: new Map() };

function bridgeCall(op, payload, timeout = 1500) {
  return new Promise((resolve, reject) => {
    const id = ++bridge.seq;
    const timer = setTimeout(() => { bridge.pending.delete(id); reject(new Error('timeout')); }, timeout);
    bridge.pending.set(id, {
      resolve: (v) => { clearTimeout(timer); resolve(v); },
      reject: (e) => { clearTimeout(timer); reject(e); },
    });
    window.postMessage({ twsuite: 'bridge-req', id, op, payload }, '*');
  });
}

window.addEventListener('message', (ev) => {
  if (ev.source !== window || !ev.data) return;
  if (ev.data.twsuite === 'bridge-res') {
    const p = bridge.pending.get(ev.data.id);
    if (!p) return;
    bridge.pending.delete(ev.data.id);
    ev.data.ok ? p.resolve(ev.data.payload) : p.reject(new Error((ev.data.payload && ev.data.payload.error) || 'erro'));
  } else if (ev.data.twsuite === 'bridge-ready' && !bridge.connected) {
    connectBridge();
  }
});

async function connectBridge() {
  try {
    const hello = await bridgeCall('hello');
    bridge.connected = true;
    bridge.version = hello.version;
    await pullFromBridge();
    addLog(`Tampermonkey conectado (script v${hello.version})`);
    renderAll();
  } catch { /* script ausente ou sem acesso a arquivos locais */ }
}

async function pullFromBridge() {
  const data = await bridgeCall('pull');
  let changedLocal = false;
  for (const [key, remote] of Object.entries(data.profiles || {})) {
    const local = state.profiles[key];
    if (!local || (remote.updatedAt || 0) > (local.updatedAt || 0)) {
      state.profiles[key] = remote;
      normalizeProfile(key);
    }
  }
  for (const [key, local] of Object.entries(state.profiles)) {
    const remote = (data.profiles || {})[key];
    if (!remote || (local.updatedAt || 0) > (remote.updatedAt || 0)) changedLocal = true;
  }
  state.accounts = data.accounts || {};
  persistLocal();
  if (changedLocal) await pushToBridge();
}

async function pushToBridge() {
  if (!bridge.connected) return false;
  try {
    await bridgeCall('pushProfiles', { profiles: state.profiles });
    return true;
  } catch {
    bridge.connected = false;
    renderSync();
    return false;
  }
}

// ------------------------------------------------------------------
// Salvamento automático
// ------------------------------------------------------------------
let saveTimer = null;
let saving = false;

function touch(key) {
  if (state.profiles[key]) state.profiles[key].updatedAt = Date.now();
  scheduleSave();
}

function scheduleSave() {
  saving = true;
  renderSync();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    persistLocal();
    await pushToBridge();
    saving = false;
    renderSync();
  }, 450);
}

// Utilidades de UI
// ------------------------------------------------------------------
function addLog(text) {
  state.log.unshift({ at: new Date(), text });
  state.log = state.log.slice(0, 12);
  renderAside();
}

function toast(text, kind = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${kind === 'err' ? 'err' : ''}`;
  el.innerHTML = `${icon(kind === 'err' ? 'x' : 'check', 'sm')}<span>${esc(text)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 3200);
}

function ago(ts) {
  if (!ts) return null;
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'agora';
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  return `há ${Math.floor(s / 86400)} d`;
}

function worldParts(world) {
  const m = String(world).match(/^([a-z]+?)(s|p|c)?(\d+)$/i);
  if (!m) return { prefix: world.slice(0, 3), num: '' };
  return { prefix: m[1] + (m[2] || ''), num: m[3] };
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  return Promise.resolve();
}

function renderSync() {
  const pill = $('#syncPill');
  pill.classList.toggle('on', bridge.connected && !saving);
  pill.classList.toggle('saving', saving);
  $('#syncText').textContent = saving
    ? 'Salvando…'

  pill.title = bridge.connected

    : 'Tampermonkey não detectado — use o código de sincronização';
}

// Render: rail

const FILTERS = [
  { id: 'all', label: 'Todas' },
  { id: 'active', label: 'Com módulos' },
  { id: 'test', label: 'Em teste' },
  { id: 'unseen', label: 'Nunca vistas' },
];

function filteredKeys() {
  const q = state.query.trim().toLowerCase();
  return allKeys().filter((k) => {
    const p = state.profiles[k];
    if (q && !k.toLowerCase().includes(q)) return false;
    if (state.filter === 'active') return activeCount(p) > 0;
    if (state.filter === 'test') return testState(p) !== 'false' && activeCount(p) > 0;
    if (state.filter === 'unseen') return !state.accounts[k];
    return true;
  });
}

function renderRail() {
  const total = allKeys().length;
  $('#railCount').textContent = String(total).padStart(2, '0');
  $('#railChips').innerHTML = FILTERS.map((f) =>
    `<button class="chip ${state.filter === f.id ? 'on' : ''}" data-filter="${f.id}" type="button">${f.label}</button>`).join('');

  const keys = filteredKeys();
  if (!keys.length) {
    $('#railList').innerHTML = `<div class="rail-empty">${total ? 'Nenhuma conta com esse filtro.' : 'Nenhuma conta ainda.<br>Adicione a primeira acima.'}</div>`;
    return;
  }
  $('#railList').innerHTML = keys.map((k) => {
    const { world, nick } = splitKey(k);
    const p = state.profiles[k];
    const s = state.accounts[k];
    const wp = worldParts(world);
    const active = activeCount(p);
    const ts = testState(p);
    const meta = s
      ? `${fmt(s.points)} pts · ${s.villages} ald. · ${ago(s.lastSeen)}`
      : 'Aguardando primeiro acesso';
    const tag = active === 0
      ? '<span class="tag tag-off">Parada</span>'
      : ts === 'false' ? '<span class="tag tag-live">Real</span>' : '<span class="tag tag-test">Teste</span>';
    const dots = MODULES.map((m) => {
      const c = p.modules[m.id];
      const cls = c.enabled ? `on ${c.settings.dryRun && !m.noTestMode ? 'test' : ''}` : '';
      return `<i class="${cls}" title="${esc(m.name)}"></i>`;
    }).join('');
    return `
      <div class="acct ${state.selected === k ? 'active' : ''} ${state.checked.has(k) ? 'checked' : ''}"
           role="button" tabindex="0" data-key="${esc(k)}" aria-pressed="${state.selected === k}">
        <span class="seal" data-check title="Selecionar para ações em lote">
          <small>${esc(wp.prefix)}</small><b>${esc(wp.num || '—')}</b>
          <span class="check">${icon('check')}</span>
        </span>
        <span class="acct-body">
          <div class="acct-name">${esc(nick)}</div>
          <div class="acct-meta">${esc(meta)}</div>
          <div class="acct-dots">${dots}</div>
        </span>
        ${tag}
      </div>`;
  }).join('');
}

  if (!state.selected) {
    main.innerHTML = `
      <div class="empty reveal">
        <div class="empty-inner">
          <svg class="empty-mark" viewBox="0 0 48 48" fill="none"><use href="#i-crest"/></svg>
          <div class="eyebrow">Sala de guerra</div>
          <h1>Sua frota começa <em>aqui.</em></h1>
          <p>Cadastre suas contas por mundo e nick, escolha o que cada uma deve automatizar e o script aplica tudo sozinho quando você abrir o jogo.</p>
          <div class="empty-actions">
            <button class="btn btn-ember" data-act="add-one" type="button">${icon('plus', 'sm')}Adicionar conta</button>
            <button class="btn btn-ghost" data-act="bulk" type="button">${icon('stack', 'sm')}Adição em massa</button>
            <button class="btn btn-ghost" data-act="import" type="button">${icon('up', 'sm')}Importar backup</button>
          </div>
        </div>
      </div>
      <div class="aside-inline" id="asideInline"></div>`;
    renderAsideInline();
    return;
  }

  const { world, nick } = splitKey(key);
  const p = state.profiles[key];
  const ts = testState(p);

  const groups = GROUPS.map((g, gi) => {
    const mods = MODULES.filter((m) => m.group === g);
    const on = mods.filter((m) => p.modules[m.id].enabled).length;
    return `
      <section class="group reveal" style="animation-delay:${60 + gi * 50}ms">
        <div class="group-head">
          <span class="group-num">${['I', 'II', 'III', 'IV'][gi]}.</span>
          <h2 class="group-name">${g}</h2>
          <span class="group-line"></span>
          <span class="group-count" data-gcount="${g}">${on}/${mods.length} ativos</span>
        </div>
        <div class="tiles">${mods.map((m) => tileHTML(m, p.modules[m.id])).join('')}</div>
      </section>`;
  }).join('');

  main.innerHTML = `
    <section class="hero reveal">
      <div class="hero-kicker"><span class="world">${esc(world.toUpperCase())}</span><span>·</span><span>Dossiê da conta</span></div>
      <div class="hero-row">
        <h1 class="hero-title">${esc(nick)}</h1>
        <div class="hero-tools">
          <button class="btn btn-ghost btn-sm" data-act="apply-model" type="button">${icon('bookmark', 'sm')}Aplicar modelo</button>
          <button class="btn btn-ghost btn-sm" data-act="save-model" type="button">${icon('plus', 'sm')}Salvar como modelo</button>
          <button class="btn btn-danger btn-sm" data-act="remove" type="button" title="Remover conta">${icon('trash', 'sm')}</button>

      </div>

      <div id="liveBox">${liveHTML(key)}</div>

    </section>
    ${groups}
    <div class="aside-inline" id="asideInline"></div>`;
  renderAsideInline();

}

function statsHTML(key) {
  const p = state.profiles[key];
  const s = state.accounts[key];
  const on = activeCount(p);
  const pct = Math.round((on / MODULES.length) * 100);
  return `
    <div class="stat"><div class="k">Pontos</div><div class="v">${s ? fmt(s.points) : '—'}</div><div class="h">${s ? 'reportado pelo script' : 'abra o jogo nesta conta'}</div></div>
    <div class="stat"><div class="k">Aldeias</div><div class="v">${s ? fmt(s.villages) : '—'}</div><div class="h">${s && s.village ? esc(`${s.village.name} (${s.village.x}|${s.village.y})`) : '—'}</div></div>
    <div class="stat"><div class="k">Último sinal</div><div class="v">${s ? esc(ago(s.lastSeen)) : '—'}</div><div class="h">${s ? `script v${esc(s.version)}` : 'nunca conectada'}</div></div>
    <div class="stat"><div class="k">Módulos ativos</div><div class="v">${on}<small> / ${MODULES.length}</small></div><div class="meter"><i style="width:${pct}%"></i></div></div>`;
}

function liveHTML(key) {
  const s = state.accounts[key];
  if (!s || !s.resources) {
    return `<div class="livecard livecard-empty">${icon('bolt', 'sm')}<span>Status ao vivo aparece aqui assim que o script rodar uma vez nesta conta (até ~90s depois de abrir o jogo).</span></div>`;
  }
  const res = s.resources;
  const pct = (n) => res.storageMax ? Math.min(100, Math.round((n / res.storageMax) * 100)) : 0;
  const resBar = (key2, label) => `
    <div class="livebar">
      <span class="livebar-label">${esc(label)}</span>
      <div class="livebar-track"><i style="width:${pct(res[key2])}%"></i></div>
      <span class="livebar-val">${fmt(res[key2])}</span>
    </div>`;
  const troops = s.troops ? Object.entries(s.troops).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]) : null;
  const troopsHTML = troops && troops.length
    ? troops.map(([u, n]) => `<span class="troop-chip">${fmt(n)} <small>${esc(attackUnitLabel(u))}</small></span>`).join('')
    : '<span class="note">sem tropas em casa (ou não lido ainda)</span>';
  const incoming = s.incomingAttacks
    ? `<span class="tag tag-off" style="background:var(--rose-soft);color:var(--rose)">⚠ ${s.incomingAttacks} ataque${s.incomingAttacks > 1 ? 's' : ''} a caminho</span>`
    : (s.incoming !== undefined ? '<span class="tag tag-live">sem ataques a caminho</span>' : '');
  return `
    <div class="livecard">
      <div class="livecard-head">
        <b>${icon('bolt', 'sm')}Ao vivo</b>
        ${incoming}
        <span class="note" style="margin-left:auto">atualizado ${esc(ago(s.at || s.lastSeen))}</span>
      </div>
      <div class="livebars">${resBar('wood', 'Madeira')}${resBar('stone', 'Argila')}${resBar('iron', 'Ferro')}</div>
      <div class="livetroops">${troopsHTML}</div>
    </div>`;
}

function testbandHTML(ts) {
  const text = ts === 'true'
    ? ['Modo teste ligado', 'Os módulos só simulam: registram no console o que fariam, sem enviar nada ao jogo.']
    : ts === 'false'
      ? ['Modo real', 'Os módulos ativos agem de verdade no jogo. Use com delays humanos.']
      : ['Modo misto', 'Alguns módulos estão em teste e outros em modo real.'];
  return `
    <svg class="ico lg" style="color:${ts === 'false' ? 'var(--jade)' : 'var(--ember)'}"><use href="#i-${ts === 'false' ? 'bolt' : 'flask'}"/></svg>
    <div class="testband-text"><b>${text[0]}</b><span>${text[1]}</span></div>
    <span class="eyebrow">Teste</span>
    <button class="lever" role="switch" aria-checked="${ts}" data-act="test-toggle" aria-label="Modo teste"></button>`;
}

function tileHTML(m, cfg) {
  const lbl = presetLabel(m, cfg);
  const open = state.openFine.has(m.id);
  const fields = m.fields.map((f) => fieldHTML(m, f, cfg.settings)).join('');
  const fine = (m.fields.length || m.note) ? `
    <div class="fine-wrap ${open ? 'open' : ''}">
      <button class="fine-toggle" data-fine="${m.id}" type="button">${icon('chev', 'sm')}Ajustes finos</button>
      <div class="fine-body">${fields}${m.note ? `<p class="note">${esc(m.note)}</p>` : ''}</div>
    </div>` : '';
  return `
    <article class="tile ${cfg.enabled ? 'on' : ''}" data-mod="${m.id}">
      <div class="tile-top">
        <span class="tile-icon">${icon(m.icon)}</span>
        <div class="tile-name"><h3>${esc(m.name)}</h3><p>${icon('pin', 'sm')}${esc(m.screen)}</p></div>
        <button class="lever" role="switch" aria-checked="${cfg.enabled}" data-toggle="${m.id}" aria-label="Ligar ${esc(m.name)}"></button>
      </div>
      <p class="tile-desc">${esc(m.desc)}</p>
      <button class="picker" data-preset="${m.id}" type="button">
        <span class="pk-v"><b data-pk-title>${esc(lbl.title)}</b><span data-pk-sub>${esc(lbl.sub)}</span></span>
        ${icon('chev', 'sm')}
      </button>
      ${m.templates ? templatesHTML(m, cfg) : ''}
      ${fine}
    </article>`;
}

function templatesHTML(m, cfg) {
  const templates = cfg.settings.templates || [];
  const activeId = cfg.settings.activeTemplateId;
  const rows = templates.length ? templates.map((t) => {
    const n = ATTACK_UNITS.reduce((acc, u) => acc + (t.units[u.value] || 0), 0);
    return `
      <div class="tpl-row ${t.id === activeId ? 'active' : ''}" data-tpl-row="${t.id}">
        <button class="tpl-pick" data-tpl-use="${m.id}:${t.id}" type="button" title="Usar este modelo">
          ${icon(t.id === activeId ? 'check' : 'target', 'sm')}
        </button>
        <span class="tpl-name">${esc(t.name)}<small>${n} tropa${n === 1 ? '' : 's'}</small></span>
        <button class="icon-btn" style="height:28px;padding:0 8px" data-tpl-edit="${m.id}:${t.id}" type="button" title="Editar">${icon('chev', 'sm')}</button>
        <button class="icon-btn" style="height:28px;padding:0 8px" data-tpl-del="${m.id}:${t.id}" type="button" title="Excluir">${icon('trash', 'sm')}</button>
      </div>`;
  }).join('') : '<p class="note" style="margin:6px 0">Nenhum modelo de tropas ainda.</p>';
  return `
    <div class="tpl-box">
      <div class="tpl-list">${rows}</div>
      <button class="btn-ghost btn-sm" style="width:100%;margin-top:8px" data-tpl-new="${m.id}" type="button">${icon('plus', 'sm')}Novo modelo de tropas</button>
    </div>`;
}

function fieldHTML(m, f, s) {
  const val = s[f.key];
  if (f.type === 'range') {
    const scale = f.scale || 1;
    return `
      <label class="fine">
        <span class="fine-top"><span>${esc(f.label)}</span><output data-out="${m.id}.${f.key}">${rangeText(f, val)}</output></span>
        <input type="range" min="${f.min / scale}" max="${f.max / scale}" step="${f.step / scale}" value="${val / scale}" data-range="${m.id}.${f.key}">
      </label>`;
  }
  if (f.type === 'select') {
    const opt = f.options.find((o) => o.value === val) || { label: val };
    return `
      <div class="fine">
        <span>${esc(f.label)}</span>
        <button class="picker" data-field-select="${m.id}.${f.key}" type="button"><span class="pk-v"><b>${esc(opt.label)}</b></span>${icon('chev', 'sm')}</button>
      </div>`;
  }
  if (f.type === 'switch') {
    return `
      <div class="fine fine-row">
        <span>${esc(f.label)}</span>
        <button class="lever sm" role="switch" aria-checked="${!!val}" data-field-switch="${m.id}.${f.key}" aria-label="${esc(f.label)}"></button>
      </div>`;
  }
  return `
    <label class="fine">
      <span>${esc(f.label)}</span>
      <input class="field" type="text" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}" data-field-text="${m.id}.${f.key}" spellcheck="false" autocomplete="off">
    </label>`;
}

function rangeText(f, val) {
  const scale = f.scale || 1;
  const n = val / scale;
  const shown = f.decimals ? n.toFixed(f.decimals).replace('.', ',') : fmt(Math.round(n));
  return `${shown} ${f.unit}`;
}

function paintRanges(root) {
  root.querySelectorAll('input[type=range]').forEach(paintRange);
}
function paintRange(el) {
  const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
  el.style.setProperty('--p', `${pct}%`);
}

function refreshTile(modId) {
  const key = state.selected;
  const tile = document.querySelector(`.tile[data-mod="${modId}"]`);
  if (!tile || !key) return;
  const m = MOD[modId];
  const cfg = state.profiles[key].modules[modId];
  tile.classList.toggle('on', cfg.enabled);
  tile.querySelector(`[data-toggle="${modId}"]`).setAttribute('aria-checked', String(cfg.enabled));
  const lbl = presetLabel(m, cfg);
  tile.querySelector('[data-pk-title]').textContent = lbl.title;
  tile.querySelector('[data-pk-sub]').textContent = lbl.sub;
}

function refreshChrome() {
  const key = state.selected;
  if (!key) return;
  const p = state.profiles[key];
  const stats = $('#heroStats');
  if (stats) stats.innerHTML = statsHTML(key);
  const live = $('#liveBox');
  if (live) live.innerHTML = liveHTML(key);
  const band = $('#testband');
  if (band) {
    const ts = testState(p);
    band.classList.toggle('live', ts === 'false');
    band.innerHTML = testbandHTML(ts);
  }
  GROUPS.forEach((g) => {
    const el = document.querySelector(`[data-gcount="${g}"]`);
    if (!el) return;
    const mods = MODULES.filter((m) => m.group === g);
    el.textContent = `${mods.filter((m) => p.modules[m.id].enabled).length}/${mods.length} ativos`;
  });
  renderRail();
  renderAside();
}

function asideHTML() {
  const keys = allKeys();
  const withMods = keys.filter((k) => activeCount(state.profiles[k]) > 0).length;
  const inTest = keys.filter((k) => activeCount(state.profiles[k]) > 0 && testState(state.profiles[k]) !== 'false').length;
  const seen24 = keys.filter((k) => state.accounts[k] && Date.now() - state.accounts[k].lastSeen < 86400000).length;

  const isFileProtocol = location.protocol === 'file:';
  const sync = bridge.connected
    ? `
      <div class="sync-hero"><span class="sync-orb on">${icon('link')}</span><div><b>Tampermonkey conectado</b><span>Script v${esc(bridge.version)} · tudo salvo direto nele</span></div></div>
      <p class="note" style="margin-top:12px">Cada conta recebe a configuração na próxima vez que você abrir o jogo com ela.</p>`
    : isFileProtocol ? `
      <div class="sync-hero"><span class="sync-orb">${icon('link')}</span><div><b>Só neste navegador</b><span>Aberto como arquivo local (file://)</span></div></div>
      <p class="note" style="margin:10px 0">Arquivo local exige permissões extras do navegador pro Tampermonkey rodar aqui. É mais simples rodar num servidor local — evita essa permissão inteira:</p>
      <ol class="steps">
        <li><span>Dê 2 cliques em <code>start-dashboard.bat</code>, na pasta do projeto.</span></li>
        <li><span>Uma aba abre em <code>http://localhost:8787/dashboard.html</code> — use essa aba a partir de agora (não esta).</span></li>
      </ol>
      <p class="note" style="margin:10px 0">Prefere continuar com o arquivo local? Ative <code>Permitir acesso a URLs de arquivo</code> nos detalhes do Tampermonkey em <code>chrome://extensions</code> e recarregue. Enquanto isso não conectar, dá pra sincronizar na mão:</p>
      <button class="btn btn-ghost btn-sm" data-act="sync-code" type="button" style="width:100%">${icon('key', 'sm')}Usar código de sincronização</button>` : `
      <div class="sync-hero"><span class="sync-orb">${icon('link')}</span><div><b>Só neste navegador</b><span>O script ainda não está lendo este painel</span></div></div>
      <ol class="steps">
        <li><span>Atualize o TW Suite no Tampermonkey para a versão <code>1.3.0</code> ou mais nova — essa versão adicionou suporte a <code>localhost</code>.</span></li>
        <li><span>Recarregue esta aba. Deve aparecer um selo no canto inferior esquerdo (<code>TW Suite v… — aguardando dashboard…</code>) confirmando que o script rodou aqui.</span></li>
        <li><span>Se o selo não aparecer, confira se o Tampermonkey está ativo (ícone colorido, não cinza) e se o script está habilitado no painel dele.</span></li>
      </ol>
      <p class="note" style="margin:10px 0">Enquanto isso não estiver ativo, use o código abaixo pra sincronizar manualmente — funciona sempre, sem depender de permissão nenhuma.</p>
      <button class="btn btn-ghost btn-sm" data-act="sync-code" type="button" style="width:100%">${icon('key', 'sm')}Usar código de sincronização</button>`;

  const models = allModels().map((md) => `
    <div class="model">
      <div class="model-body"><b>${esc(md.name)}</b><span>${esc(md.desc)}</span></div>
      ${state.selected ? `<button class="btn btn-ghost btn-sm" data-model-apply="${md.id}" type="button">Aplicar</button>` : ''}
      ${md.builtin ? '' : `<button class="icon-btn" style="height:32px;padding:0 8px" data-model-del="${md.id}" type="button" title="Excluir modelo">${icon('trash', 'sm')}</button>`}
    </div>`).join('');

  const log = state.log.length
    ? `<ul class="log">${state.log.map((l) => `<li><time>${l.at.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</time><span>${esc(l.text)}</span></li>`).join('')}</ul>`
    : '<p class="note">Nada por aqui ainda nesta sessão.</p>';

  return `
    <div class="card"><div class="card-head"><h4>Sincronização</h4></div>${sync}</div>
    <div class="card">
      <div class="card-head"><h4>Visão da frota</h4></div>
      <div class="kv">
        <div><b>${keys.length}</b><span>contas</span></div>
        <div><b>${withMods}</b><span>com módulos</span></div>
        <div><b>${inTest}</b><span>em teste</span></div>
        <div><b>${seen24}</b><span>ativas em 24h</span></div>
      </div>
    </div>
    <div class="card"><div class="card-head"><h4>Modelos</h4></div>${models}</div>
    <div class="card"><div class="card-head"><h4>Diário</h4></div>${log}</div>`;
}

    <button class="btn btn-ghost btn-sm" data-bulk="test-off" type="button">${icon('bolt', 'sm')}Modo real</button>
    <button class="btn btn-ghost btn-sm" data-bulk="model" type="button">${icon('bookmark', 'sm')}Aplicar modelo</button>
    <span class="sep"></span>
    <button class="btn btn-danger btn-sm" data-bulk="remove" type="button">${icon('trash', 'sm')}Remover</button>
    <button class="icon-btn" data-bulk="clear" type="button" title="Limpar seleção">${icon('x', 'sm')}</button>`;
}

function renderAll() {
  renderSync();
  renderRail();
  renderMain();
  renderAside();
  renderBulkbar();
}

const pop = { el: null, onPick: null, items: [], hl: -1, anchor: null };

function openPop(anchor, items, current, onPick) {
  closePop();
  pop.el = $('#pop');
  pop.anchor = anchor;
  pop.onPick = onPick;
  pop.items = items.filter((i) => !i.sep);
  pop.hl = Math.max(0, pop.items.findIndex((i) => i.value === current));
  pop.el.innerHTML = items.map((it) => it.sep ? '<div class="pop-sep"></div>' : `
    <button class="pop-item ${it.value === current ? 'sel' : ''}" data-v="${esc(it.value)}" type="button" role="option" aria-selected="${it.value === current}">
      <span class="pv"><b>${esc(it.label)}</b>${it.hint ? `<span>${esc(it.hint)}</span>` : ''}</span>
      ${icon('check', 'sm tick')}
    </button>`).join('');
  const r = anchor.getBoundingClientRect();
  pop.el.style.minWidth = `${Math.max(240, r.width)}px`;
  pop.el.style.left = `${Math.min(r.left, window.innerWidth - Math.max(240, r.width) - 12)}px`;
  pop.el.classList.add('show');
  const h = pop.el.offsetHeight;
  const below = r.bottom + 6 + h < window.innerHeight;
  pop.el.style.top = `${below ? r.bottom + 6 : Math.max(8, r.top - h - 6)}px`;
  highlightPop();
}

function highlightPop() {
  if (!pop.el) return;
  pop.el.querySelectorAll('.pop-item').forEach((b, i) => b.classList.toggle('hl', i === pop.hl));
  const cur = pop.el.querySelectorAll('.pop-item')[pop.hl];
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function closePop() {
  if (!pop.el) return;
  pop.el.classList.remove('show');
  pop.el = null;
  pop.onPick = null;
}

document.addEventListener('click', (e) => {
  const item = e.target.closest('.pop-item');
  if (item && pop.el) {
    const cb = pop.onPick;
    const v = item.dataset.v;
    closePop();
    if (cb) cb(v);
    return;
  }
  if (pop.el && !e.target.closest('#pop') && !(pop.anchor && pop.anchor.contains(e.target))) closePop();
}, true);
window.addEventListener('resize', closePop);
document.addEventListener('scroll', (e) => { if (pop.el && !e.target.closest?.('#pop')) closePop(); }, true);

function moduleOptions(m) {
  const items = [{ value: 'off', label: 'Desligado', hint: 'Não roda nesta conta' }, { sep: true }];
  if (!m.presets.length) {
    items.push({ value: 'on', label: 'Ligado', hint: m.note || 'Usa a configuração atual' });
  } else {
    m.presets.forEach((pr) => items.push({ value: pr.id, label: pr.label, hint: m.hint({ ...m.defaults, ...pr.settings }) }));
  }
  return items;
}

const main = $('#main');

main.addEventListener('click', (e) => {
  const key = state.selected;
  const t = e.target;

  const act = t.closest('[data-act]');
  if (act) return handleAct(act.dataset.act, act);

  if (!key) return;
  const p = state.profiles[key];

  const toggle = t.closest('[data-toggle]');
  if (toggle) {
    const id = toggle.dataset.toggle;
    p.modules[id].enabled = !p.modules[id].enabled;
    touch(key);
    refreshTile(id);
    refreshChrome();
    return;
  }

  const preset = t.closest('[data-preset]');
  if (preset) {
    const m = MOD[preset.dataset.preset];
    const cfg = p.modules[m.id];
    openPop(preset, moduleOptions(m), presetOf(m, cfg), (v) => {
      applyPreset(cfg, m, v);
      touch(key);
      rerenderTile(m.id);
      refreshChrome();
    });
    return;
  }

  const fine = t.closest('[data-fine]');
  if (fine) {
    const id = fine.dataset.fine;
    state.openFine.has(id) ? state.openFine.delete(id) : state.openFine.add(id);
    fine.parentElement.classList.toggle('open');
    return;
  }

  const sel = t.closest('[data-field-select]');
  if (sel) {
    const [id, fk] = sel.dataset.fieldSelect.split('.');
    const f = MOD[id].fields.find((x) => x.key === fk);
    const cfg = p.modules[id];
    openPop(sel, f.options.map((o) => ({ value: o.value, label: o.label })), cfg.settings[fk], (v) => {
      cfg.settings[fk] = v;
      touch(key);
      rerenderTile(id);
      refreshChrome();
    });
    return;
  }

  const sw = t.closest('[data-field-switch]');
  if (sw) {
    const [id, fk] = sw.dataset.fieldSwitch.split('.');
    const cfg = p.modules[id];
    cfg.settings[fk] = !cfg.settings[fk];
    sw.setAttribute('aria-checked', String(cfg.settings[fk]));
    touch(key);
    refreshTile(id);
    return;
  }

  const tplNew = t.closest('[data-tpl-new]');
  if (tplNew) return openTemplateEditor(tplNew.dataset.tplNew, null);

  const tplEdit = t.closest('[data-tpl-edit]');
  if (tplEdit) {
    const [id, tplId] = tplEdit.dataset.tplEdit.split(':');
    const tpl = (p.modules[id].settings.templates || []).find((x) => x.id === tplId);
    return openTemplateEditor(id, tpl);
  }

  const tplUse = t.closest('[data-tpl-use]');
  if (tplUse) {
    const [id, tplId] = tplUse.dataset.tplUse.split(':');
    const cfg = p.modules[id];
    cfg.settings.activeTemplateId = cfg.settings.activeTemplateId === tplId ? null : tplId;
    touch(key);
    rerenderTile(id);
    refreshChrome();
    return;
  }

  const tplDel = t.closest('[data-tpl-del]');
  if (tplDel) {
    const [id, tplId] = tplDel.dataset.tplDel.split(':');
    const cfg = p.modules[id];
    const tpl = (cfg.settings.templates || []).find((x) => x.id === tplId);
    if (tpl && confirm(`Excluir o modelo "${tpl.name}"?`)) {
      cfg.settings.templates = cfg.settings.templates.filter((x) => x.id !== tplId);
      if (cfg.settings.activeTemplateId === tplId) cfg.settings.activeTemplateId = null;
      touch(key);
      rerenderTile(id);
      refreshChrome();
    }
  }
});

main.addEventListener('input', (e) => {
  const key = state.selected;
  if (!key) return;
  const r = e.target.closest('[data-range]');
  if (r) {
    const [id, fk] = r.dataset.range.split('.');
    const f = MOD[id].fields.find((x) => x.key === fk);
    const val = Math.round(Number(r.value) * (f.scale || 1));
    state.profiles[key].modules[id].settings[fk] = val;
    paintRange(r);
    const out = main.querySelector(`[data-out="${id}.${fk}"]`);
    if (out) out.textContent = rangeText(f, val);
    refreshTile(id);
    touch(key);
    return;
  }
  const tx = e.target.closest('[data-field-text]');
  if (tx) {
    const [id, fk] = tx.dataset.fieldText.split('.');
    state.profiles[key].modules[id].settings[fk] = tx.value.trim();
    refreshTile(id);
    touch(key);
  }
});

function rerenderTile(id) {
  const tile = document.querySelector(`.tile[data-mod="${id}"]`);
  if (!tile) return;
  tile.outerHTML = tileHTML(MOD[id], state.profiles[state.selected].modules[id]);
  const fresh = document.querySelector(`.tile[data-mod="${id}"]`);
  paintRanges(fresh);
}

function handleAct(act, el) {
  const key = state.selected;
  switch (act) {
    case 'add-one': return openAddOne();
    case 'bulk': return openBulk();
    case 'import': return $('#importFile').click();
    case 'sync-code': return openSyncCode();
    case 'test-toggle': {
      const ts = testState(state.profiles[key]);
      setTestMode(key, ts !== 'true');
      addLog(`${splitKey(key).nick}: modo ${ts !== 'true' ? 'teste' : 'real'}`);
      refreshChrome();
      MODULES.forEach((m) => refreshTile(m.id));
      return;
    }
    case 'apply-model':
      return openPop(el, allModels().map((md) => ({ value: md.id, label: md.name, hint: md.desc })), null, (id) => {
        const md = allModels().find((x) => x.id === id);
        applyModel(key, md);
        addLog(`Modelo "${md.name}" aplicado em ${splitKey(key).nick}`);
        toast(`Modelo "${md.name}" aplicado`);
        renderMain();
        refreshChrome();
      });
    case 'save-model': return openSaveModel();
    case 'remove': return confirmRemove([key]);
  }
}

function onAsideClick(e) {
  const act = e.target.closest('[data-act]');
  if (act) return handleAct(act.dataset.act, act);
  const ap = e.target.closest('[data-model-apply]');
  if (ap && state.selected) {
    const md = allModels().find((x) => x.id === ap.dataset.modelApply);
    applyModel(state.selected, md);
    addLog(`Modelo "${md.name}" aplicado em ${splitKey(state.selected).nick}`);
    toast(`Modelo "${md.name}" aplicado`);
    renderMain();
    refreshChrome();
    return;
  }
  const del = e.target.closest('[data-model-del]');
  if (del) {
    state.models = state.models.filter((x) => x.id !== del.dataset.modelDel);
    persistLocal();
    renderAside();
    toast('Modelo excluído');
  }
}

$('#bulkbar').addEventListener('click', (e) => {
  const b = e.target.closest('[data-bulk]');
  if (!b) return;
  const keys = [...state.checked];
  switch (b.dataset.bulk) {
    case 'clear':
      state.checked.clear();
      break;
    case 'test-on':
    case 'test-off': {
      const on = b.dataset.bulk === 'test-on';
      keys.forEach((k) => setTestMode(k, on));
      addLog(`${keys.length} conta(s) em modo ${on ? 'teste' : 'real'}`);
      toast(`${keys.length} conta(s) em modo ${on ? 'teste' : 'real'}`);
      renderMain();
      break;
    }
    case 'model':
      return openPop(b, allModels().map((md) => ({ value: md.id, label: md.name, hint: md.desc })), null, (id) => {
        const md = allModels().find((x) => x.id === id);
        keys.forEach((k) => applyModel(k, md));
        addLog(`Modelo "${md.name}" aplicado em ${keys.length} conta(s)`);
        toast(`Modelo aplicado em ${keys.length} conta(s)`);
        renderAll();
      });
    case 'remove':
      return confirmRemove(keys);
  }
  renderRail();
  renderAside();
  renderBulkbar();
});

const scrim = $('#scrim');
const modal = $('#modal');
let modalCleanup = null;
let lastFocus = null;

function openModal(html, { narrow = false, palette = false, onMount } = {}) {
  closePop();
  lastFocus = document.activeElement;
  modal.className = `modal ${narrow ? 'narrow' : ''} ${palette ? 'palette' : ''}`;
  modal.innerHTML = html;
  scrim.classList.add('show');
  if (onMount) modalCleanup = onMount(modal) || null;
  const focusable = modal.querySelector('[autofocus], input, textarea, button');
  if (focusable) setTimeout(() => focusable.focus(), 30);
}

function closeModal() {
  scrim.classList.remove('show');
  if (typeof modalCleanup === 'function') modalCleanup();
  modalCleanup = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) closeModal(); });
modal.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeModal(); });

      </div>
      <div style="margin-top:14px">

      </div>
      <div class="callout" style="margin:16px 0 0">${icon('flask')}<div>Contas novas começam em <b>modo teste</b>. Quando estiver tudo certo, desligue o teste no dossiê da conta.</div></div>
    </div>
    <div class="modal-foot">
      <span class="spacer"></span>
      <button class="btn btn-ghost" data-close type="button">Cancelar</button>
      <button class="btn btn-ember" id="f-save" type="button">${icon('plus', 'sm')}Adicionar</button>
    </div>`, {
    narrow: true,
    onMount(root) {
      const paint = () => {
        const md = modelId === 'none' ? { name: 'Tudo desligado', desc: 'Configure módulo por módulo' } : allModels().find((x) => x.id === modelId);
        root.querySelector('#f-model b').textContent = md.name;
        root.querySelector('#f-model .pk-v span').textContent = md.desc;
      };
      paint();
      root.querySelector('#f-model').addEventListener('click', (e) => {
        const items = [{ value: 'none', label: 'Tudo desligado', hint: 'Configure módulo por módulo' }, { sep: true },
          ...allModels().map((md) => ({ value: md.id, label: md.name, hint: md.desc }))];
        openPop(e.currentTarget, items, modelId, (v) => { modelId = v; paint(); });
      });
      const save = () => {
        const world = root.querySelector('#f-world').value.trim();
        const nick = root.querySelector('#f-nick').value.trim();
        if (!isWorld(world)) return toast('Mundo inválido — use o formato br144', 'err');

        const key = accountKey(world, nick);
        if (state.profiles[key]) return toast('Essa conta já existe', 'err');
        state.profiles[key] = newProfile();
        if (modelId !== 'none') applyModel(key, allModels().find((x) => x.id === modelId));
        touch(key);
        state.selected = key;
        addLog(`Conta ${world.toLowerCase()} · ${nick} adicionada`);
        toast('Conta adicionada');
        closeModal();
        renderAll();
      };
      root.querySelector('#f-save').addEventListener('click', save);
      root.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); }));
    },
  });
}
